name: Gestor de DNS Technosofia

on:
  push:
    branches:
      - main
    paths:
      - 'domains/*.json'
  workflow_dispatch:

jobs:
  desplegar-subdominio:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Inyectar DNS en Cloudflare
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # 1. Buscar el archivo modificado
          ARCHIVO=$(ls -t domains/*.json | head -n 1)
          echo "Procesando: $ARCHIVO"
          
          # 2. Extraer el nombre del subdominio
          SUBDOMINIO=$(basename "$ARCHIVO" .json)
          
          # 3. Leer el JSON
          TIPO=$(jq -r '.records | keys[0]' "$ARCHIVO")
          DESTINO=$(jq -r '.records | .[] | .[0]' "$ARCHIVO")
          
          echo "Creando subdominio: $SUBDOMINIO.technosofia.xyz"
          echo "Tipo de registro: $TIPO"
          echo "Apuntando hacia: $DESTINO"
          
          # 4. Enviar la orden a Cloudflare
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
               -H "Authorization: Bearer $API_TOKEN" \
               -H "Content-Type: application/json" \
               --data '{
                 "type": "'"$TIPO"'",
                 "name": "'"$SUBDOMINIO"'",
                 "content": "'"$DESTINO"'",
                 "ttl": 1,
                 "proxied": false
               }'
          
          echo -e "\n¡Comando finalizado!"
